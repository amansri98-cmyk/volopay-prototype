<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volopay AR × TaxKitab – Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F5FB;--card:#fff;--bd:#E1E6F3;--tx:#1B2347;--mu:#5B6486;--bl:#3B5BFF;--cy:#29C4F2;--or:#FF8A3D;--gr:#12A150;--grb:#E3F6EC;--orb:#FFF0E3;--blb:#E8ECFF;--nv:#0B1233;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1233;--card:#131D4A;--bd:#27346E;--tx:#EEF1FF;--mu:#A5B0DD;--grb:#0F3A2A;--orb:#4A2B12;--blb:#1D2A6B}}
:root[data-theme=dark]{--bg:#0B1233;--card:#131D4A;--bd:#27346E;--tx:#EEF1FF;--mu:#A5B0DD;--grb:#0F3A2A;--orb:#4A2B12;--blb:#1D2A6B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.5}
header{background:var(--nv);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:26px}header .x{color:#8C9AD6}header .tag{margin-left:auto;color:#C9D2F5;font-size:12px}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}p.sub{color:var(--mu);margin:0 0 16px}
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.st{flex:1;min-width:150px;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;font:inherit;color:var(--tx);text-align:left}
.st b{width:26px;height:26px;border-radius:50%;background:var(--bd);color:var(--mu);display:grid;place-items:center;font-size:12px;flex:none}
.st.on{border-color:var(--bl);box-shadow:0 0 0 2px var(--blb)}.st.on b{background:var(--bl);color:#fff}.st.done b{background:var(--gr);color:#fff}
.st small{display:block;color:var(--mu);font-size:11px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}.kpi span{color:var(--mu);font-size:12px}.kpi div{font-size:20px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;text-align:left;font-size:12px}td,th{padding:9px 6px;border-bottom:1px solid var(--bd)}
.pill{padding:2px 10px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap}.p-paid{background:var(--grb);color:var(--gr)}.p-over{background:var(--orb);color:var(--or)}.p-pend,.p-sent{background:var(--blb);color:var(--bl)}.p-draft{background:var(--bd);color:var(--mu)}
.btn{background:var(--bl);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 13px Poppins,system-ui,sans-serif;cursor:pointer}.btn.ghost{background:var(--blb);color:var(--bl)}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:260px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:13px}.kv span:first-child{color:var(--mu)}
.big{font-size:26px;font-weight:700}.note{background:var(--blb);color:var(--bl);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.ok{background:var(--grb);color:var(--gr)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{background:var(--grb);color:var(--gr);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:500}
.pay{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;gap:10px;align-items:center;cursor:pointer}.pay.sel{border-color:var(--bl);background:var(--blb)}
.hl{animation:fl 1.6s ease 2}@keyframes fl{50%{background:var(--grb)}}
.foot{color:var(--mu);font-size:11px;text-align:center;margin-top:20px}.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--bl);border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(1turn)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>

<main>
<h1>How your clients will use Volopay AR</h1>
<p class="sub">Click through the three steps. Sample data only; screens are illustrative.</p>
<div class="steps" id="steps"></div>
<div id="view"></div>
<div class="foot">Illustrative prototype with sample data. Final features and availability to be confirmed with Volopay.</div>
</main>
<script>
var S={step:1,inv:'draft',method:'UPI',paying:false,matching:0};
var others=[['INV-1039','Zenith Foods',64500,'paid','02 Nov'],['INV-1040','Bluepeak Logistics',240000,'over','28 Oct'],['INV-1041','Orbit Studios',86000,'pend','25 Nov']];
var AMT=118000;
function inr(n){return '₹'+n.toLocaleString('en-IN')}
function pill(k,t){return '<span class="pill p-'+k+'">'+t+'</span>'}
function go(n){S.step=n;render()}
function steps(){var t=[['Invoice sent','Create & share'],['Customer pays','Via payment link'],['Auto-matched','Reconciled for you']];
 document.getElementById('steps').innerHTML=t.map(function(x,i){var c=i+1===S.step?' on':(i+1<S.step?' done':'');return '<button class="st'+c+'" onclick="go('+(i+1)+')"><b>'+(i+1<S.step?'✓':i+1)+'</b><span>'+x[0]+'<small>'+x[1]+'</small></span></button>'}).join('')}
function dash(){var paid=others[0][2]+(S.inv==='paid'?AMT:0);var out=86000+(S.inv==='sent'?AMT:0);
 var rows=others.slice().map(function(o){return [o[0],o[1],o[2],o[3],o[4]]});
 var st={draft:['draft','Draft'],sent:['sent','Sent'],paid:['paid','Paid']}[S.inv];
 rows.push(['INV-1042','Acme Retail Pvt Ltd',AMT,st[0],'30 Nov']);
 var lbl={paid:'Paid',over:'Overdue',pend:'Pending'};
 return '<div class="grid"><div class="kpi"><span>Outstanding</span><div>'+inr(out+240000)+'</div></div><div class="kpi"><span>Overdue</span><div style="color:var(--or)">'+inr(240000)+'</div></div><div class="kpi"><span>Collected this month</span><div style="color:var(--gr)">'+inr(paid)+'</div></div></div>'+
 '<div class="card"><b>Invoices</b><table><tr><th>No.</th><th>Customer</th><th>Amount</th><th>Due</th><th>Status</th></tr>'+rows.map(function(r){return '<tr'+(r[0]==='INV-1042'&&S.step===3?' class="hl"':'')+'><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+inr(r[2])+'</td><td>'+r[4]+'</td><td>'+pill(r[3],lbl[r[3]]||st[1])+'</td></tr>'}).join('')+'</table></div>'}
function v1(){var h='<div class="row"><div class="card"><b>New invoice · INV-1042</b><div style="height:8px"></div>'+
 kv('Customer','Acme Retail Pvt Ltd')+kv('Description','Annual bookkeeping retainer')+kv('Amount',inr(AMT))+kv('Due date','30 Nov 2026')+kv('Payment details','Bank transfer & UPI link')+'<div style="height:12px"></div>';
 if(S.inv==='draft')h+='<button class="btn" onclick="S.inv=\'sent\';render()">Send invoice</button>';
 else h+='<div class="note ok">✓ Invoice sent to billing@acmeretail.example with a payment link.</div><button class="btn" onclick="go(2)">Next: customer pays →</button>';
 h+='</div><div>'+(S.inv==='draft'?'<div class="card" style="color:var(--mu)">Review the details, then send. Your customer receives an email with the invoice and a payment link.</div>':'')+'</div></div>';
 return h+dash()}
function kv(a,b){return '<div class="kv"><span>'+a+'</span><span>'+b+'</span></div>'}
function v2(){if(S.inv==='draft'){return '<div class="card">Send the invoice in step 1 first. <button class="btn ghost" onclick="go(1)">Go to step 1</button></div>'}
 var h='<div class="note">This is what the <b>customer</b> sees when they open the link.</div><div class="card" style="max-width:440px;margin:0 auto"><div style="color:var(--mu);font-size:12px">Invoice INV-1042 from TaxKitab client</div><div class="big">'+inr(AMT)+'</div><div style="color:var(--mu)">Due 30 Nov 2026 · Acme Retail Pvt Ltd</div><div style="height:10px"></div>';
 if(S.inv==='paid'){return h+'<div class="note ok">✓ Payment successful · UTR 4821 9937 0214</div><button class="btn" onclick="go(3)">Next: see auto-match →</button></div>'}
 ['UPI','Bank transfer'].forEach(function(m){h+='<div class="pay'+(S.method===m?' sel':'')+'" onclick="S.method=\''+m+'\';render()"><span>'+(S.method===m?'◉':'○')+'</span> '+m+'</div>'});
 return h+'<div style="height:8px"></div><button class="btn" style="width:100%" '+(S.paying?'disabled':'')+' onclick="pay()">'+(S.paying?'<span class="spin"></span> Processing…':'Pay '+inr(AMT))+'</button></div>'}
function pay(){S.paying=true;render();setTimeout(function(){S.paying=false;S.inv='paid';S.matching=0;render()},1200)}
function v3(){if(S.inv!=='paid'){return '<div class="card">Complete the payment in step 2 first. <button class="btn ghost" onclick="go(2)">Go to step 2</button></div>'}
 var h='<div class="card"><b>Incoming bank credit</b><div class="kv"><span>ACME RETAIL PVT LTD · UTR 4821 9937 0214</span><span><b>'+inr(AMT)+'</b></span></div>';
 if(S.matching===0){S.matching=1;setTimeout(function(){S.matching=2;if(S.step===3)render()},1400)}
 if(S.matching===1)h+='<div class="note"><span class="spin"></span> Matching to open invoices…</div>';
 else h+='<div class="note ok">✓ Matched automatically to <b>INV-1042</b>. No manual reconciliation needed.</div><div class="chips"><span class="chip">✓ Amount</span><span class="chip">✓ Customer</span><span class="chip">✓ Invoice reference</span></div><button class="btn ghost" onclick="S={step:1,inv:\'draft\',method:\'UPI\',paying:false,matching:0};render()">↺ Replay flow</button>';
 return h+'</div>'+(S.matching===2?dash():'')}
function render(){steps();document.getElementById('view').innerHTML=[v1,v2,v3][S.step-1]();}
render();
</script></body></html>
